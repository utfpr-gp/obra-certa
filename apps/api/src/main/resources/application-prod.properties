# Perfil de producao (SPRING_PROFILES_ACTIVE=prod).
# Tudo que muda entre ambientes vem de variavel de ambiente. As que nao tem valor
# padrao sao obrigatorias: sem elas a aplicacao nao sobe, em vez de subir insegura.

# Banco de producao: RDS PostgreSQL. O Compose configura TLS verify-full e a CA RDS.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# Pool pequeno para a instancia de banco usada no TCC.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
# Fecha conexoes ociosas para permitir a suspensao do Aurora Serverless.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
# A retomada do Aurora apos a suspensao pode demorar alguns segundos.
spring.datasource.hikari.connection-timeout=60000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# No RDS, Flyway usa o mesmo endpoint direto da aplicacao. FLYWAY_URL continua
# disponivel para outros ambientes. Usuario e senha sao repassados explicitamente.
spring.flyway.url=${FLYWAY_URL:${SPRING_DATASOURCE_URL}}
spring.flyway.user=${SPRING_DATASOURCE_USERNAME}
spring.flyway.password=${SPRING_DATASOURCE_PASSWORD}

# Segredo de assinatura do JWT: obrigatorio. Gere com, por exemplo, `openssl rand -base64 48`.
api.security.token.secret=${JWT_SECRET}

# Origens do frontend autorizadas no CORS, separadas por virgula. Atras do nginx do
# docker-compose (mesma origem) o CORS nem e usado; o valor importa quando o frontend
# fica em outro dominio.
obracerta.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Seed de demonstracao nunca roda em producao (o runner tambem exige o perfil dev).
obracerta.seed.enabled=false

# Logs so no console: plataformas como Render e o `docker logs` coletam a saida padrao,
# e o sistema de arquivos do container nao e persistente.
logging.file.name=
logging.level.root=INFO
logging.level.org.springframework.web=WARN

# Recuperação de senha e remetente SMTP.
obracerta.frontend-url=${FRONTEND_URL}
obracerta.password-recovery.from=${MAIL_FROM}
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
