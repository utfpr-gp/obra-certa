# Configuracao para conexao do banco de dados PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:obracerta}?useTimezone=true&serverTimezone=UTC&useSSL=false
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracao do JPA e Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# O schema e versionado pelo Flyway (db/migration). O Hibernate apenas confere que
# as entidades correspondem ao que as migrations criaram - nunca altera a tabela.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
