# Ative junto de prod para Aurora Express: SPRING_PROFILES_ACTIVE=prod,aws-iam.
# O plugin IAM da URL usa credenciais temporarias do perfil IAM da EC2.
# Nao configure AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY nem salve tokens no .env.
spring.datasource.driver-class-name=software.amazon.jdbc.Driver
spring.flyway.driver-class-name=software.amazon.jdbc.Driver
