# Perfil usado pela CI (SPRING_PROFILES_ACTIVE=test), contra o Postgres de servico
# do workflow. A URL, o usuario e a senha chegam por variavel de ambiente
# (SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD),
# entao nao ha credencial neste arquivo.
#
# Ate a adocao do Flyway este perfil nao existia: o `test` caia no
# application.properties, que nao declara ddl-auto nenhum, e a suite rodava contra
# um banco vazio. Agora as migrations criam o schema antes dos testes, e o
# `validate` garante que entidade e migration nao divergiram.

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Banco de CI nasce vazio a cada execucao, entao a V1 roda do zero.
spring.flyway.clean-disabled=true
