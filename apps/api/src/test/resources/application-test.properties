# PostgreSQL isolado fornecido pelo ambiente via SPRING_DATASOURCE_*.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

# Cada contexto Spring em cache mantem o proprio pool de conexoes. Com muitos
# contextos de teste, o padrao do Hikari (10) esgota o max_connections=100 do
# Postgres da CI ("too many clients already"). 5 por contexto ainda atende os
# testes de migration, que usam mais de uma conexao ao mesmo tempo.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
