@if (isOpen()) {
  <div class="fixed inset-0 z-50 bg-slate-900/50 flex items-center justify-center p-4" (click)="closed.emit()">
    <section class="bg-white rounded-2xl w-full max-w-lg p-6 shadow-2xl" (click)="$event.stopPropagation()">
      <div class="flex items-center justify-between mb-5">
        <h2 class="text-xl font-bold text-slate-900">{{ project() ? 'Editar obra' : 'Cadastrar nova obra' }}</h2>
        <button type="button" (click)="closed.emit()" aria-label="Fechar" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg transition-colors cursor-pointer text-xl">×</button>
      </div>
      <form [formGroup]="form" (ngSubmit)="save()" class="space-y-4">
        <label class="block text-sm font-medium text-slate-700">Nome
          <input
            formControlName="name"
            placeholder="Ex.: Reforma da cozinha"
            class="input border-1 rounded-md text-gray-700 w-full mt-1 focus:outline-none focus:ring-2 focus:border-transparent"
            [ngClass]="form.controls.name.touched && form.controls.name.invalid ? 'border-red-500 focus:ring-red-500' : 'border-gray-300 focus:ring-[#007A80]'"
          />
        </label>
        @if (form.controls.name.touched && form.controls.name.invalid) { <p class="text-xs text-rose-600">Informe um nome com ao menos 3 caracteres.</p> }
        <label class="block text-sm font-medium text-slate-700">Tipo
          <select formControlName="type" class="select border-1 rounded-md text-gray-700 w-full mt-1 border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#007A80] focus:border-transparent">
            <option value="NEW_CONSTRUCTION">Construção Nova</option><option value="RENOVATION">Reforma</option><option value="EXPANSION">Ampliação</option>
          </select>
        </label>
        <label class="block text-sm font-medium text-slate-700">Localização
          <input
            formControlName="location"
            placeholder="Ex.: Rua das Flores, 123 - São Paulo/SP (opcional)"
            class="input border-1 rounded-md text-gray-700 w-full mt-1 border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#007A80] focus:border-transparent"
          />
        </label>
        @if (project()) {
          <label class="block text-sm font-medium text-slate-700">Status
            <select formControlName="status" class="select border-1 rounded-md text-gray-700 w-full mt-1 border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#007A80] focus:border-transparent">
              <option value="IN_PROGRESS">Em andamento</option><option value="PAUSED">Pausada</option><option value="COMPLETED">Concluída</option>
            </select>
          </label>
        }
        @if (errorMessage()) { <p role="alert" class="text-sm text-rose-600">{{ errorMessage() }}</p> }
        <div class="flex justify-between items-center pt-3">
          @if (project()) {
            <button
              type="button"
              data-testid="open-delete-project"
              (click)="deleteRequested.emit()"
              class="flex items-center gap-1.5 text-sm text-rose-600 hover:text-rose-700 hover:underline rounded-md focus:outline-none focus-visible:ring-2 focus-visible:ring-rose-500 focus-visible:ring-offset-2 cursor-pointer transition-colors"
            >
              <svg lucideTrash2 [size]="14" />
              Excluir obra
            </button>
          } @else {
            <span></span>
          }
          <div class="flex gap-2">
            <button type="button" (click)="closed.emit()" class="btn border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 rounded-md font-medium px-4 py-2">Cancelar</button>
            <button type="submit" class="btn border-0 bg-[#007A80] hover:bg-[#00686D] rounded-md text-white font-medium px-4 py-2">Salvar</button>
          </div>
        </div>
      </form>
    </section>
  </div>
}
