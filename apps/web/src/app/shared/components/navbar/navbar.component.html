<header class="bg-white border-b border-slate-200 h-16 px-4 md:px-6 flex items-center justify-between sticky top-0 z-30 select-none">
  <div class="flex items-center gap-3">
    <button type="button" (click)="onMenuClick()" class="btn btn-ghost btn-circle min-h-11 min-w-11 lg:hidden text-slate-600" aria-label="Abrir menu lateral">
      <svg lucideMenu [size]="20" />
    </button>
    <div class="relative">
      <button type="button" (click)="toggleDeskDropdown($event)" class="flex items-center gap-2.5 px-3 py-1.5 rounded-lg hover:bg-slate-50 text-left">
        <div class="w-7 h-7 rounded-lg bg-[#E5F6F6] text-[#007A80] flex items-center justify-center"><svg lucideHome [size]="15" /></div>
        <div class="leading-tight">
          <span class="block text-sm font-semibold text-slate-900">{{ activeProject()?.name || 'Selecionar obra' }}</span>
          <span class="block text-xs text-slate-400">{{ activeProjectTypeLabel() }}</span>
        </div>
        <svg lucideChevronDown [size]="15" class="text-slate-400" />
      </button>
      @if (deskDropdownOpen()) {
        <div class="fixed inset-0 z-40" (click)="deskDropdownOpen.set(false)"></div>
        <div class="absolute top-[calc(100%+8px)] left-0 w-80 bg-white border border-slate-200 rounded-xl shadow-2xl p-2 z-50">
          <div class="px-3 py-2 text-[11px] font-bold uppercase text-slate-400 border-b border-slate-100">Suas Obras ({{ projects().length }})</div>
          <div class="max-h-80 overflow-y-auto py-1">
            @for (project of projects(); track project.id) {
              <button type="button" (click)="selectProject(project, $event)" class="w-full text-left p-3 rounded-lg hover:bg-slate-50 flex items-center justify-between cursor-pointer transition-colors">
                <span class="text-sm font-bold text-slate-800">{{ project.name }}</span>
                @if (project.id === activeProject()?.id) { <svg lucideCheck [size]="16" class="text-[#007A80]" /> }
              </button>
            }
          </div>
          <button type="button" (click)="openProjectModal()" class="btn-oc-primary mt-2 px-4 py-2 w-full flex gap-2">
            <svg lucidePlus [size]="16" /> Cadastrar nova obra
          </button>
          @if (activeProject(); as project) {
            <button type="button" (click)="openProjectModal(project)" class="w-full mt-2 py-2 text-sm font-semibold text-[#007A80] hover:text-[#00686D] hover:underline rounded-md focus:outline-none focus-visible:ring-2 focus-visible:ring-[#007A80] focus-visible:ring-offset-2">Editar obra atual</button>
          }
        </div>
      }
    </div>
  </div>
  @if (projectsLoadError()) {
    <div role="alert" class="flex items-center gap-2 text-sm text-rose-600">
      <span>{{ projectsLoadError() }}</span>
      <button type="button" class="btn min-h-11 border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 rounded-md font-medium" (click)="retryLoadProjects()">
        Tentar novamente
      </button>
    </div>
  }
  <button
    type="button"
    (click)="onLogout()"
    data-testid="navbar-logout"
    class="flex min-h-11 items-center gap-2 px-3 py-1.5 text-sm font-medium text-slate-600 hover:text-rose-600 hover:bg-rose-50 rounded-lg cursor-pointer transition-colors"
    aria-label="Sair do sistema"
  >
    <svg lucideLogOut [size]="16" class="shrink-0" />
    <span>Sair</span>
  </button>
</header>

<app-project-modal
  [isOpen]="projectModalOpen()"
  [project]="projectBeingEdited()"
  (closed)="closeProjectModal()"
  (saved)="onProjectSaved($event)"
  (deleteRequested)="openDeleteModal()"
/>

<app-confirm-modal
  [isOpen]="deleteModalOpen()"
  title="Excluir obra?"
  [description]="deleteConfirmationMessage()"
  confirmText="Excluir"
  [isDestructive]="true"
  (cancel)="closeDeleteModal()"
  (confirm)="confirmDeleteProject()"
/>
