<!-- Sidebar content -->
<div class="h-full flex flex-col justify-between p-4 select-none">
  <div>
    <!-- Logo Header (Centralizado e em Destaque) -->
    <div class="mb-6 pb-4 border-b border-slate-200 relative flex items-center justify-center">
      <div class="flex items-center justify-center py-1">
        <img 
          src="assets/images/logo.png" 
          alt="ObraCerta" 
          class="h-10 max-w-[180px] object-contain transition-transform hover:scale-105" 
        />
      </div>
      <!-- Mobile Close Button -->
      <button 
        type="button"
        (click)="onClose()" 
        class="absolute right-0 top-1/2 -translate-y-1/2 btn btn-ghost btn-sm btn-circle lg:hidden text-slate-500 hover:text-slate-800"
        aria-label="Fechar menu"
      >
        <svg lucideX [size]="18" />
      </button>
    </div>

    <!-- Navigation Items -->
    <nav class="flex flex-col gap-1.5" aria-label="Menu Principal">
      @for (item of navItems; track item.id) {
        <a 
          href="javascript:void(0)"
          class="flex items-center gap-3 px-4 py-3 rounded-xl text-[15px] font-medium transition-all duration-150"
          [ngClass]="{
            'bg-[#007A80] text-white font-bold shadow-md shadow-[#007A80]/20': item.active,
            'text-slate-600 hover:text-slate-900 hover:bg-slate-100': !item.active
          }"
        >
          @switch (item.icon) {
            @case ('pie-chart') {
              <svg lucidePieChart [size]="19" [class.opacity-80]="!item.active" />
            }
            @case ('wallet') {
              <svg lucideWallet [size]="19" [class.opacity-80]="!item.active" />
            }
            @case ('receipt') {
              <svg lucideReceipt [size]="19" [class.opacity-80]="!item.active" />
            }
            @case ('calendar') {
              <svg lucideCalendar [size]="19" [class.opacity-80]="!item.active" />
            }
            @case ('users') {
              <svg lucideUsers [size]="19" [class.opacity-80]="!item.active" />
            }
            @case ('file-text') {
              <svg lucideFileText [size]="19" [class.opacity-80]="!item.active" />
            }
          }
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </div>

  <!-- Bottom Workspace info / Footer -->
  <div class="pt-4 border-t border-slate-200 px-2 text-xs text-slate-400 text-center">
    ObraCerta &copy; 2026
  </div>
</div>
