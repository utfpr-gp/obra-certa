<div
  class="px-4 md:px-6 py-3 flex items-center justify-between gap-3 shrink-0 border-b-2"
  [ngClass]="{
    'bg-rose-50 border-rose-500 text-rose-900': type() === 'danger',
    'bg-amber-50 border-amber-500 text-amber-900': type() === 'warning',
    'bg-sky-50 border-sky-500 text-sky-900': type() === 'info',
    'bg-emerald-50 border-emerald-500 text-emerald-900': type() === 'success'
  }"
>
  <div class="flex items-center gap-2.5 text-sm font-medium">
    @switch (type()) {
      @case ('danger') {
        <svg lucideCircleAlert [size]="18" class="text-rose-600 shrink-0" />
      }
      @case ('warning') {
        <svg lucideTriangleAlert [size]="18" class="text-amber-600 shrink-0" />
      }
      @case ('info') {
        <svg lucideInfo [size]="18" class="text-sky-600 shrink-0" />
      }
      @case ('success') {
        <svg lucideCheckCircle [size]="18" class="text-emerald-600 shrink-0" />
      }
    }
    <span>
      <strong class="font-bold">{{ title() }}</strong>
      {{ message() }}
    </span>
  </div>

  <div class="flex shrink-0 items-center gap-2">
  @if (actionLabel()) {
    <button
      type="button"
      (click)="onAction()"
      class="text-sm font-bold underline shrink-0 cursor-pointer transition-colors"
      [ngClass]="{
        'text-rose-800 hover:text-rose-950': type() === 'danger',
        'text-amber-800 hover:text-amber-950': type() === 'warning',
        'text-sky-800 hover:text-sky-950': type() === 'info',
        'text-emerald-800 hover:text-emerald-950': type() === 'success'
      }"
    >
      {{ actionLabel() }}
    </button>
  }
  @if (dismissLabel(); as label) {
    <button type="button" [attr.aria-label]="label" (click)="dismissClick.emit()"
      class="min-h-11 min-w-11 rounded-md text-xl hover:bg-black/5">
      <span aria-hidden="true">×</span>
    </button>
  }
  </div>
</div>
