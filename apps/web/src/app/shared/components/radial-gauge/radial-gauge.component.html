<div class="bg-white rounded-2xl p-5 shadow-xs border border-slate-200/80 flex flex-col items-center justify-center text-center w-full h-full">
  <div class="relative w-28 h-28 flex items-center justify-center mb-3">
    <!-- Circular Background & Progress SVG -->
    <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
      <circle
        cx="50"
        cy="50"
        r="40"
        stroke="#E2E8F0"
        stroke-width="10"
        fill="transparent"
      />
      <circle
        cx="50"
        cy="50"
        r="40"
        [attr.stroke]="strokeColor()"
        stroke-width="10"
        stroke-linecap="round"
        fill="transparent"
        [attr.stroke-dasharray]="251.2"
        [attr.stroke-dashoffset]="strokeDashoffset()"
        class="transition-all duration-500 ease-out"
      />
    </svg>
    <div class="absolute inset-0 flex flex-col items-center justify-center">
      <span class="text-2xl font-extrabold text-slate-900 tracking-tight">
        {{ percent() }}%
      </span>
      <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">
        usado
      </span>
    </div>
  </div>

  <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-0.5">
    {{ label() }}
  </div>
  <div class="text-lg font-extrabold text-slate-900 tabular-nums">
    {{ currentValue() }}
  </div>
  <div class="text-xs text-slate-400 mt-0.5 tabular-nums">
    de {{ totalValue() }}
  </div>
</div>
