@if (isOpen()) {
  <div
    class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center p-4 transition-opacity animate-fade-in"
    (click)="onCancel()"
  >
    <div
      class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100 flex flex-col gap-4 animate-scale-up"
      (click)="$event.stopPropagation()"
    >
      <div class="flex items-start justify-between gap-3">
        <div class="flex items-center gap-3">
          <div
            class="w-10 h-10 rounded-2xl flex items-center justify-center shrink-0"
            [ngClass]="isDestructive() ? 'bg-rose-100 text-rose-600' : 'bg-amber-100 text-amber-600'"
          >
            <svg lucideTriangleAlert [size]="20" />
          </div>
          <h3 class="text-lg font-bold text-slate-900">{{ title() }}</h3>
        </div>
        <button
          type="button"
          (click)="onCancel()"
          class="text-slate-400 hover:text-slate-600 p-1 rounded-lg transition-colors cursor-pointer"
        >
          <svg lucideX [size]="18" />
        </button>
      </div>

      <p class="text-sm text-slate-600 leading-relaxed">
        {{ description() }}
      </p>

      <div class="flex items-center justify-end gap-2.5 pt-2">
        <button
          type="button"
          (click)="onCancel()"
          class="btn btn-ghost text-slate-600 hover:bg-slate-100 font-medium rounded-md px-4 h-10 min-h-0 text-sm cursor-pointer"
        >
          {{ cancelText() }}
        </button>
        <button
          type="button"
          (click)="onConfirm()"
          class="btn border-0 font-medium rounded-md px-5 h-10 min-h-0 text-sm shadow-sm transition-all active:scale-98 cursor-pointer"
          [ngClass]="isDestructive() ? 'bg-rose-600 hover:bg-rose-700 text-white' : 'bg-[#007A80] hover:bg-[#00686d] text-white'"
        >
          {{ confirmText() }}
        </button>
      </div>
    </div>
  </div>
}
