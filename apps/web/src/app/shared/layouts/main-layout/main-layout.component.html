<div class="flex h-screen bg-[#F8FAFC] text-slate-800 font-sans overflow-hidden">
  <!-- Desktop Sidebar -->
  <aside class="hidden lg:flex w-64 bg-white border-r border-slate-200 flex-col shrink-0 z-20">
    <app-sidebar (closeDrawer)="closeSidebar()" />
  </aside>

  <!-- Mobile Drawer Overlay -->
  @if (sidebarOpen()) {
    <div
      class="fixed inset-0 bg-black/40 z-50 lg:hidden flex transition-opacity duration-200"
      (click)="closeSidebar()"
    >
      <div
        class="w-72 max-w-[80vw] h-full bg-white shadow-2xl flex flex-col z-50 animate-drawer"
        (click)="$event.stopPropagation()"
      >
        <app-sidebar (closeDrawer)="closeSidebar()" />
      </div>
    </div>
  }

  <!-- Main Content Shell -->
  <div class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden">
    <!-- Navbar (Sticky Top across all pages) -->
    <app-navbar (toggleSidebar)="toggleSidebar()" />

    <!-- Routed Page Content -->
    <div class="flex-1 min-h-0 overflow-y-auto">
      <router-outlet />
    </div>
  </div>
</div>
