events {
    #valor default é 512 conexões simultâneas
    worker_connections  1024;
}

http {

  #configurações gerais
  include /etc/nginx/mime.types;
  sendfile on;

  default_type application/octet-stream;

  gzip on;
  gzip_http_version 1.1;
  gzip_disable      "MSIE [1-6]\.";
  gzip_min_length   1000;
  gzip_vary         on;
  gzip_proxied      expired no-cache no-store private auth;
  gzip_types        text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_comp_level   9;

  #configuração do servidor
  server {
    #disponível a partir de qualquer endereço de rede
    #listen 0.0.0.0:80;

    #disponível a partir de qualquer endereço de rede no IPv6
    #listen [::]:80;

    #suporta requisições de todas interfaces de rede - IPV4 e IPV6
    listen 80;
    client_max_body_size 11m;

    #nome do domínio do site ou endereço IP do servidor
    #server_name obracerta.com
    server_name localhost;

    # root /usr/share/nginx/html;
    root /usr/share/nginx/html/frontend/browser; #alpine
    # root /var/www/html    /frontend/browser; #ubuntu


    index index.html;

    location /obracerta-api/api {
        proxy_pass http://18.119.167.159:8080/obracerta/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        #proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type' always;
    }

    location / {
      try_files $uri $uri/ /index.html =404;
    }
  }
}
