# Arquivo independente: nao combinar com docker-compose.yml (desenvolvimento).
name: obracerta-prod

# O Aurora Express usa exclusivamente IAM. O plugin renova o token de conexao.
x-jdbc-url: &jdbc-url jdbc:aws-wrapper:postgresql://${RDS_HOST:?Informe RDS_HOST}:5432/${RDS_DATABASE:?Informe RDS_DATABASE}?sslmode=verify-full&sslrootcert=/etc/ssl/rds/AmazonRootCA1.pem&wrapperPlugins=iam&wrapperDialect=pg&iamRegion=${AWS_REGION:?Informe AWS_REGION}&connectTimeout=60

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  backend:
    image: obracerta-api:${RELEASE_TAG:-local}
    build:
      context: ./apps/api
    restart: unless-stopped
    init: true
    mem_limit: 512m
    logging: *logging
    environment:
      SPRING_PROFILES_ACTIVE: prod,aws-iam
      PORT: '8080'
      SPRING_DATASOURCE_URL: *jdbc-url
      SPRING_DATASOURCE_USERNAME: ${RDS_USERNAME:?Informe RDS_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ''
      FLYWAY_URL: *jdbc-url
      AWS_REGION: ${AWS_REGION:?Informe AWS_REGION}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: 'true'
      DB_POOL_SIZE: '5'
      OBRACERTA_SEED_ENABLED: 'false'
      JWT_SECRET: ${JWT_SECRET:?Informe JWT_SECRET}
      CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN:?Informe APP_DOMAIN}
      FRONTEND_URL: https://${APP_DOMAIN:?Informe APP_DOMAIN}
      MAIL_FROM: ${MAIL_FROM:?Informe MAIL_FROM}
      SMTP_HOST: ${SMTP_HOST:?Informe SMTP_HOST}
      SMTP_PORT: '587'
      SMTP_USERNAME: ${SMTP_USERNAME:?Informe SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Informe SMTP_PASSWORD}
      RECEIPT_STORAGE_ENDPOINT: ${RECEIPT_STORAGE_ENDPOINT:?Informe RECEIPT_STORAGE_ENDPOINT}
      RECEIPT_STORAGE_BUCKET: ${RECEIPT_STORAGE_BUCKET:?Informe RECEIPT_STORAGE_BUCKET}
      RECEIPT_STORAGE_REGION: ${RECEIPT_STORAGE_REGION:?Informe RECEIPT_STORAGE_REGION}
      RECEIPT_STORAGE_ACCESS_KEY: ${RECEIPT_STORAGE_ACCESS_KEY:?Informe RECEIPT_STORAGE_ACCESS_KEY}
      RECEIPT_STORAGE_SECRET_KEY: ${RECEIPT_STORAGE_SECRET_KEY:?Informe RECEIPT_STORAGE_SECRET_KEY}
      RECEIPT_STORAGE_PATH_STYLE: 'true'
    volumes:
      - type: bind
        source: ./deploy/certs/AmazonRootCA1.pem
        target: /etc/ssl/rds/AmazonRootCA1.pem
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      # Requisicao invalida sem credenciais: 400 confirma que o Spring iniciou.
      # Hibernate/Flyway precisam concluir antes da inicializacao do servidor.
      test: ['CMD-SHELL', 'test "$$(curl -s --max-time 5 -o /dev/null -w ''%{http_code}'' -H ''Content-Type: application/json'' --data ''{}'' http://127.0.0.1:8080/obracerta/api/auth/login)" = 400']
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

  frontend:
    image: obracerta-web:${RELEASE_TAG:-local}
    build:
      context: ./apps/web
    restart: unless-stopped
    mem_limit: 64m
    logging: *logging
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/healthz']
      interval: 30s
      timeout: 5s
      retries: 3

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 64m
    logging: *logging
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Informe APP_DOMAIN}
    ports:
      - '${PUBLIC_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80'
      - '${PUBLIC_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:2019/config/']
      interval: 30s
      timeout: 5s
      retries: 3

  # Cliente temporario de backup/restauracao; nao inicia um servidor PostgreSQL.
  db-tools:
    image: postgres:17
    profiles: [tools]
    environment:
      PGHOST: ${RDS_HOST:?Informe RDS_HOST}
      PGPORT: '5432'
      PGDATABASE: ${RDS_DATABASE:?Informe RDS_DATABASE}
      PGUSER: ${RDS_USERNAME:?Informe RDS_USERNAME}
      # Token efemero fornecido pelo script, nunca salvo no arquivo .env.
      PGPASSWORD: ${PGPASSWORD:-}
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /etc/ssl/rds/AmazonRootCA1.pem
    volumes:
      - type: bind
        source: ./deploy/certs/AmazonRootCA1.pem
        target: /etc/ssl/rds/AmazonRootCA1.pem
        read_only: true
        bind:
          create_host_path: false

volumes:
  caddy_data:
  caddy_config:
