<div class="justify-center flex h-screen items-center">
  <div
    class="card w-full sm:w-[90%] md:w-[60%] lg:w-[55%] shrink-0 sm:shadow-none md:shadow-2xl rounded-2xl"
  >
    <div class="card-body">
      <h2 class="card-title justify-center text-gray-500 font-semibold">
        Seja bem-vindo ao
      </h2>
      <img src="assets/images/logo.png" class="mx-auto mb-4 w-40" />
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="fieldset">
        <label for="email" class="label font-medium">Email:</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          class="input border-1 rounded-md border-gray-300 text-gray-700 w-auto mb-3 focus:outline-none focus:ring-2 focus:ring-[#007A80] focus:border-transparent"
          placeholder="Insira o seu e-mail"
        />
        @if (form.get("email")?.invalid && form.get("email")?.touched) {
          <span class="text-red-500 text-sm mb-3"
            >Por favor, insira um e-mail válido.</span
          >
        }
        <label for="password" class="label font-medium">Senha:</label>
        <div class="relative w-auto mb-3">
        <input
          id="password"
          [type]="showPassword ? 'text' : 'password'"
          formControlName="password"
          class="input border-1 rounded-md border-gray-300 text-gray-700 w-full pr-10 focus:outline-none focus:ring-2 focus:ring-[#007A80] focus:border-transparent"
          placeholder="Insira a sua senha"
        />
          <button
            type="button"
            class="absolute inset-y-0 right-3 flex items-center text-gray-400 hover:text-gray-700 focus:outline-none focus:text-gray-700"
            (click)="togglePassword()"
          >
            @if (showPassword) {
              <svg lucideEyeOff [size]="20"/>
            } @else {
              <svg lucideEye [size]="20"/>
            }
          </button>
        </div>
        @if (form.get("password")?.invalid && form.get("password")?.touched) {
          <span class="text-red-500 text-sm mb-3">A senha é inválida.</span>
        }
        <div class="divider m-auto">
          <a class="link link-hover text-[#007A80]">Esqueceu a senha?</a>

        </div>
        @if (errorMessage) {
          <span class="text-red-500 text-sm text-center mt-2">{{
            errorMessage
          }}</span>
        }
        <button
          type="submit"
          class="btn border-0 mt-4 bg-[#007A80] hover:bg-[#00686d] rounded-md text-white font-medium"
          [disabled]="isLoading"
        >
          Entrar
        </button>
        <div class="divider text-gray-500">Não possui uma conta?</div>
        <button
          type="button"
          class="btn border-0 rounded-md text-black bg-[#FDBE00] hover:bg-[#f7ae05] w-[40%] m-auto font-medium"
          (click)="navigateToRegister()"
        >
          Registrar-se
        </button>
      </form>
    </div>
  </div>
</div>
