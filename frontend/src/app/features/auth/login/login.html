<div class="justify-center flex h-screen items-center">
  <div class="card w-[55%] shrink-0 shadow-2xl rounded-2xl">
    <div class="card-body">
      <h2 class="card-title justify-center text-gray-500 font-semibold">
        Seja bem-vindo ao ObraCerta
      </h2>
      <img src="/src/assets/logo.png" class="mx-auto mb-4" />
      <fieldset class="fieldset">
        <label class="label font-medium">Email:</label>
        <input
          type="email"
          class="input border-1 rounded-md border-gray-300 text-gray-400 w-auto mb-3"
          placeholder="Insira o seu e-mail"
        />
        <label class="label font-medium">Senha:</label>
        <input
          type="password"
          class="input border-1 rounded-md border-gray-300 text-gray-400 w-auto mb-3"
          placeholder="Insira a sua senha"
        />
        <div class="m-auto">
          <a class="link link-hover text-[#007A80]">Esqueceu a senha?</a>
        </div>
        <button
          class="btn border-0 mt-4 bg-[#007A80] rounded-md text-white font-medium"
        >
          Entrar
        </button>
        <div class="divider text-gray-500">Não possui uma conta?</div>
        <button
          class="btn border-0 rounded-md text-black bg-[#FDBE00] w-[40%] m-auto font-medium"
        >
          Registrar-se
        </button>
      </fieldset>
    </div>
  </div>
</div>
