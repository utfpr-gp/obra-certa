name: CI

on:
  pull_request:
    branches: [ "develop", "main" ]
  push:
    branches: [ "develop", "main" ]

jobs:
  test-backend:
    name: Testes do Backend do ObraCerta - Java ${{ matrix.java-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [ '21' ]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: obracerta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      - name: Configurar Cache do Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Rodar Testes
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/obracerta_test
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          POSTGRES_DB: obracerta_test
          SPRING_PROFILES_ACTIVE: 'test'
        working-directory: ./apps/api
        run: |
          chmod +x mvnw
          ./mvnw -B test -Dspring.profiles.active=test -e -X

      - name: Test errors
        if: failure()
        working-directory: ./apps/api
        run: |
          echo "Test failed"
          cat target/surefire-reports/*.txt || true
          exit 1 

  test-frontend:
    name: Testes do Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './apps/web/package-lock.json'

      - name: Instalar dependências
        working-directory: ./apps/web
        run: npm ci

      - name: Rodar testes do frontend
        working-directory: ./apps/web
        run: npx ng test --watch=false --browsers=ChromeHeadless

      - name: Validar build do frontend
        working-directory: ./apps/web
        run: npm run build
