name: CI

on: pull_request

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [21]
    name: Obra Certa unit tests running on Java ${{ matrix.java }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run tests
        env:
          SPRING_PROFILES_ACTIVE: 'test'
        run: mvn -B -f backend/pom.xml test -Dspring.profiles.active=test -e -X

      - name: Test errors
        if: failure()
        run: |
          echo "Test failed"
          find backend/target/surefire-reports -name "*.txt" -exec cat {} \ || true;
          exit 1
