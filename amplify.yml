version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            - npm run build
            - test -f dist/frontend/browser/index.html
      artifacts:
        baseDirectory: dist/frontend/browser
        files:
          - '**/*'
      cache:
        paths:
          - .npm/**/*
    appRoot: apps/web
